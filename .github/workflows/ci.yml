# The stubbed tier needs no Binary Ninja: the tests install a stub and run the
# real QBinDiff against it. The live tier needs a headless licence and stays a
# local job (tests/run_all.py without --no-live).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # QBinDiff ships wheels for these; anything newer builds from source.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install libmagic
        # python-magic, pulled in by qbindiff, dlopens it at import.
        run: sudo apt-get install -y --no-install-recommends libmagic1
      - name: Install
        run: python -m pip install --upgrade pip && pip install -r requirements.txt ruff ty pytest
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: ty check
      - name: Test
        run: python tests/run_all.py --no-live
      - name: Test under pytest
        run: pytest -q tests
